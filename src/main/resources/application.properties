# ===================================================================
# F1 Legacy Ticketing SOAP Service - Configuration
# ===================================================================

spring.application.name=f1-ticketing-legacy-soap
server.port=${PORT:8080}

# H2 Database Configuration (In-Memory)
spring.datasource.url=jdbc:h2:mem:f1_ticketing_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Initialization with data.sql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Spring Web Services Configuration
spring.webservices.path=/ws
